name: AI Hedge Fund Daily Briefing & Auto Trading

on:
  schedule:
    - cron: '0 1 * * 0-4' # 매주 월~금 아침 10시 (한국 시간 기준) = UTC 21시 (일~목) [큐 지연 감안]
  workflow_dispatch: # GitHub 웹에서 수동 실행 버튼 활성화

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install yfinance pandas numpy requests openpyxl

      - name: Run Modular Quant & Hedge Fund System
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NHPLUG_APP_KEY: ${{ secrets.NHPLUG_APP_KEY }}
          NHPLUG_APP_SECRET: ${{ secrets.NHPLUG_APP_SECRET }}
          NHPLUG_BASE_URL: "https://api.nhplug.com:8443"
          NHPLUG_ENABLE_TRADING: "true"
          ACCOUNT_NO: "20601669894"
        run: |
          python main.py
