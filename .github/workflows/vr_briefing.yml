name: VR 5.0 Strategy Daily Briefing & Auto Trading

on:
  workflow_dispatch:
  repository_dispatch:
    types: [run-vr-bot, workflow_dispatch]

permissions:
  contents: write

jobs:
  run-vr-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests openpyxl python-dotenv pypdf pdfplumber pymupdf

      - name: Run VR 5.0 Bot & Order Executor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NHPLUG_APP_KEY: ${{ secrets.NHPLUG_APP_KEY }}
          NHPLUG_APP_SECRET: ${{ secrets.NHPLUG_APP_SECRET }}
          NHPLUG_BASE_URL: "https://api.nhplug.com:8443"
          ACCOUNT_NO: ${{ secrets.ACCOUNT_NO }}
        run: |
          python vr_bot.py
          python vr_order_executor.py --execute

      - name: Commit and push VR state & excel log
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add vr_state.json
          git add -f vr_portfolio_log.xlsx
          git diff --staged --quiet || git commit -m "Auto-update VR 5.0 state and excel log [skip ci]"
          git push
