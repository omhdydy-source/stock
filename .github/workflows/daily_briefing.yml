name: AI Hedge Fund Daily Briefing & Auto Trading

on:
  workflow_dispatch: # GitHub 웹 및 단축어 수동/원격 실행용
  repository_dispatch:
    types: [run-stock-bot, workflow_dispatch]

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Upgrade pip & Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests openpyxl python-dotenv

      - name: Install requirements if exists
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install python-dotenv explicitly
        run: |
          pip install python-dotenv

      - name: Run Modular Quant & Hedge Fund System
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NHPLUG_APP_KEY: ${{ secrets.NHPLUG_APP_KEY }}
          NHPLUG_APP_SECRET: ${{ secrets.NHPLUG_APP_SECRET }}
          NHPLUG_BASE_URL: "https://api.nhplug.com:8443"
          NHPLUG_ENABLE_TRADING: "true"
          ACCOUNT_NO: ${{ secrets.ACCOUNT_NO }}
        run: |
          python main.py

      - name: Commit and push updated state & excel log
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add infinite_v4_state.json stock_portfolio_log.xlsx
          git diff --staged --quiet || git commit -m "Auto-update V4.0 state and excel log [skip ci]"
          git push
